name: Deploy Sundae Run website and garage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      # Preserve the normal/portable build, then assemble the website at / and
      # the complete game at /garage/ with all its relative assets.
      - run: npm run build:pages
      - name: Configure the official www domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.cname // ""')
          if [ "$current" = "www.sundaerun.com" ]; then
            echo "The official www domain is already configured."
          elif gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" --raw-field cname=www.sundaerun.com --raw-field build_type=workflow > domain-response.json 2> domain-error.txt; then
            echo "The official www domain is configured."
          else
            detail=$(jq -r '.message // "GitHub rejected the domain settings change"' domain-response.json)
            echo "::warning title=Pages domain requires repository administrator::$detail"
            echo "Set **www.sundaerun.com** in repository **Settings → Pages → Custom domain** before changing registrar DNS. Code deployment can proceed independently." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Enforce HTTPS when the domain certificate is ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ready=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '(.https_certificate // {}) | .state == "approved" and ((.domains // []) | index("www.sundaerun.com") != null)')
          if [ "$ready" = "true" ]; then
            if ! gh api --method PUT "repos/$GITHUB_REPOSITORY/pages" --field https_enforced=true; then
              echo "::warning title=HTTPS enforcement requires repository administrator::Enable Enforce HTTPS in repository Settings → Pages."
            fi
          else
            echo "HTTPS enforcement awaits DNS and GitHub certificate approval. Re-run this workflow after DNS is connected."
          fi
