name: Check public domain DNS and HTTPS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Inspect public DNS, redirects and TLS without changing records
        run: node scripts/check-public-domain.mjs
